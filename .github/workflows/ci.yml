name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm run lint` is intentionally omitted: this repo has no ESLint config
      # yet (next lint drops into an interactive setup). Add it here once configured.
      - run: npm run test:coverage
